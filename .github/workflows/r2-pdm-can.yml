name: R2 Synapse PDM CAN configurator

on:
  push:
    paths:
      - 'r2_pdm_configurator/**'
      - '.github/workflows/r2-pdm-can.yml'
    branches:
      - 'feature/r2-pdm-can-configurator'
  pull_request:
    paths:
      - 'r2_pdm_configurator/**'
      - '.github/workflows/r2-pdm-can.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q r2_pdm_configurator
      - name: Test CAN protocol without hardware
        run: python -m unittest discover -s r2_pdm_configurator/tests -v

  gui-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime libraries
        run: python -m pip install 'PyQt6>=6.6' 'python-can>=4.3'
      - name: Instantiate and close desktop configurator headlessly
        run: |
          python - <<'PY'
          import os, sys
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          sys.path.insert(0, 'r2_pdm_configurator')
          from PyQt6.QtWidgets import QApplication
          from app import MainWindow
          application = QApplication([])
          window = MainWindow()
          assert window.table.model().rowCount() == 35
          window.close()
          application.quit()
          PY
