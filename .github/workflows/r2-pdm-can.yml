name: R2 Synapse PDM CAN configurator

on:
  push:
    paths:
      - 'r2_pdm_configurator/**'
      - '.github/workflows/r2-pdm-can.yml'
    branches:
      - 'feature/r2-pdm-can-configurator'
  pull_request:
    paths:
      - 'r2_pdm_configurator/**'
      - '.github/workflows/r2-pdm-can.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install virtual CAN, coverage and offscreen Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install -r r2_pdm_configurator/tests/requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q r2_pdm_configurator
      - name: Test CAN protocol without hardware
        run: python -m coverage run --branch --source=r2_pdm_configurator -m unittest discover -s r2_pdm_configurator/tests -v
      - name: Produce coverage reports
        if: always()
        run: |
          python -m coverage report --omit='*/tests/*'
          python -m coverage xml --omit='*/tests/*' -o artifacts/python/coverage.xml
          python -m coverage html --omit='*/tests/*' -d artifacts/python/html
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdm-python-coverage-${{ matrix.python }}
          path: artifacts/python/
          if-no-files-found: error

  gui-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install runtime libraries
        run: python -m pip install -r r2_pdm_configurator/tests/requirements-ci.txt
      - name: Instantiate and close desktop configurator headlessly
        run: |
          python - <<'PY'
          import os, sys
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          sys.path.insert(0, 'r2_pdm_configurator')
          from PyQt6.QtWidgets import QApplication
          from app import MainWindow
          application = QApplication([])
          window = MainWindow()
          assert window.table.model().rowCount() == 35
          window.close()
          application.quit()
          PY
