name: PDM telemetry UI offscreen tests
on:
  push:
    branches: [agent/pdm-ui-telemetry]
  pull_request:
permissions:
  contents: read
jobs:
  telemetry-ui:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyQt6==6.11.0 python-can==4.6.1
      - run: python -m unittest discover -s r2_pdm_configurator/tests -p 'test_ui*.py' -v
